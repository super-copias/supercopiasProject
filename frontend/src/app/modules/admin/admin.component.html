<div class="admin-layout" [class.side-collapsed]="collapsed">
    <app-side-nav [collapsed]="collapsed" [mobileOpen]="mobileOpen" (requestClose)="closeMobile()"></app-side-nav>
    <main class="content" [class.shifted]="!collapsed && !mobileOpen">
        <nav class="navbar bg-white shadow-sm">
            <div class="container-fluid">
                <div class="d-flex align-items-center">
                    <!-- Botón hamburguesa para desktop -->
                    <button class="btn btn-link me-3 sidebar-toggle desktop-only" (click)="toggleSidebar()" aria-label="Toggle navigation">
                        <i class="fas fa-bars fa-lg"></i>
                    </button>
                    <!-- Logo y nombre de la aplicación -->
                    <div class="d-flex align-items-center">
                        <img src="assets/img/logo azul.png" alt="SuperCopias" class="me-2" style="height: 36px;">
                        <span class="navbar-brand mb-0 h1">SuperCopias Admin</span>
                    </div>
                </div>
                <div class="d-flex align-items-center">
                    <!-- Botón hamburguesa para móvil (a la derecha) -->
                    <button class="btn btn-link sidebar-toggle mobile-only me-2" (click)="toggleSidebar(true)" aria-label="Toggle navigation">
                        <i class="fas fa-bars fa-lg"></i>
                    </button>
                    <!-- Información del usuario -->
                    <div class="d-flex align-items-center me-3">
                        <i class="fas fa-user-circle me-2 text-primary"></i>
                        <span class="fw-medium">{{(auth.user$ | async)?.username || 'Usuario'}}</span>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-cog"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user-cog me-2"></i> Mi cuenta</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i> Configuración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" (click)="auth.logout()">
                                <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
                            </button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <div class="content-body">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
