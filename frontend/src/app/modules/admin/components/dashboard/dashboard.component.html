<div class="dashboard">
    <div class="row mb-4">
        <div class="col-xl-3 col-md-6">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Trabajos Pendientes</div>
                            <div class="text-lg fw-bold">{{estadisticas.trabajosPendientes}}</div>
                        </div>
                        <i class="fas fa-tasks fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card bg-warning text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Clientes Activos</div>
                            <div class="text-lg fw-bold">{{estadisticas.clientesActivos}}</div>
                        </div>
                        <i class="fas fa-users fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Ingresos Mensuales</div>
                            <div class="text-lg fw-bold">${{estadisticas.ingresosMensuales}}</div>
                        </div>
                        <i class="fas fa-dollar-sign fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Servicios Completados</div>
                            <div class="text-lg fw-bold">{{estadisticas.serviciosCompletados}}</div>
                        </div>
                        <i class="fas fa-check-circle fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Empleados</h5>
            <div class="d-flex gap-2">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Buscar colaborador..." (input)="search$.next($any($event.target).value)">
                    <button class="btn btn-outline-secondary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <app-colaboradores-table [colaboradores]="colaboradoresFiltered"></app-colaboradores-table>
        </div>
    </div>
</div>
