<div class="table-responsive">
    <table class="table table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Entrega</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let c of clientes">
                <td>{{c.id}}</td>
                <td>{{c.nombre}}</td>
                <td>{{c.telefono}}</td>
                <td>{{c.email}}</td>
                <td>{{c.direccion}}</td>
                <td>{{c.entrega}}</td>
                <td>
                    <button class="btn btn-sm btn-link" (click)="verDetalles(c)">
                        <i class="fas fa-info-circle"></i> Detalles
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<!-- pagination and summary moved to the parent list component -->
