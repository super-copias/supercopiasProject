services:
  # Backend API
  - type: web
    name: supercopias-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supercopias-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /
    
  # Frontend Static Site  
  - type: web
    name: supercopias-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/supercopias-frontend
    rootDir: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database
  - name: supercopias-db